<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  :root{
    --color-bg:#14171f;--color-surface:#292f3d;--color-border:rgba(151,161,186,.16);--color-border-strong:rgba(151,161,186,.30);
    --color-text-secondary:#c2c8d6;--color-text-muted:#919cb6;--color-text-primary:#f3f4f7;--color-brand-primary:#2ccebe;--color-on-brand:#14171f;
    --sans:'Source Serif 4',Georgia,serif;--display:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  }
  html,body{height:100%}
  body{
    font-family:var(--sans);color:var(--color-text-secondary);background:var(--color-bg);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;overflow-x:hidden;-webkit-font-smoothing:antialiased;
    padding:max(2rem,env(safe-area-inset-top)) max(1.25rem,env(safe-area-inset-right)) max(2rem,env(safe-area-inset-bottom)) max(1.25rem,env(safe-area-inset-left));
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;
    background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 0%,transparent 68%);
  }
  .badge{
    display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--color-border-strong);border-radius:999px;
    padding:.35rem .85rem .35rem .6rem;font-size:.76rem;color:var(--color-text-secondary);margin-bottom:1.6rem;font-family:var(--mono);
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--color-brand-primary)}
  .code{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(2.6rem,1rem+9vw,5rem);line-height:1;color:var(--color-text-primary);letter-spacing:-.02em;margin-bottom:.3em}
  .code span{color:var(--color-brand-primary)}
  h1{font-size:clamp(1.05rem,1rem+.5vw,1.3rem);color:var(--color-text-primary);margin-bottom:.6rem;font-weight:600}
  p{max-width:38ch;line-height:1.7;margin-bottom:2rem;font-size:.92rem}
  .links{display:flex;gap:.65rem;flex-wrap:wrap;justify-content:center}
  .btn{
    display:inline-flex;align-items:center;gap:.45rem;min-height:44px;
    padding:.65rem 1.2rem;border-radius:6px;font-size:.88rem;font-weight:600;
    font-family:var(--sans);text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s;
  }
  .btn-solid{background:var(--color-brand-primary);color:var(--color-on-brand)}
  .btn-solid:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(44,206,190,.28)}
  .btn-line{border:1px solid var(--color-border-strong);color:var(--color-text-primary)}
  .btn-line:hover{transform:translateY(-2px);border-color:var(--color-brand-primary);color:var(--color-brand-primary)}
  ::selection{background:rgba(44,206,190,.18)}
  :focus-visible{outline:2px solid var(--color-brand-primary);outline-offset:3px;border-radius:6px}
  @media (forced-colors:active){.btn-solid{background:Highlight;color:HighlightText}}
</style>
</head>
